<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice" role="img" aria-label="House of Aliens — image pending">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="800" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#b6ff3c" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0v40" fill="none" stroke="#22222e" stroke-width="0.6"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#grid)" opacity="0.6"/>
  <rect width="800" height="1000" fill="url(#halo)"/>

  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#33334a" stroke-width="1"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="#b6ff3c" stroke-width="1" stroke-dasharray="4 8" opacity="0.35"/>

  <g stroke="#b6ff3c" stroke-width="2" fill="none">
    <path d="M40 70 L40 40 L70 40"/>
    <path d="M730 40 L760 40 L760 70"/>
    <path d="M760 930 L760 960 L730 960"/>
    <path d="M70 960 L40 960 L40 930"/>
  </g>

  <g transform="translate(400 470)">
    <circle r="180" fill="none" stroke="#22222e" stroke-width="1"/>
    <circle r="140" fill="none" stroke="#22222e" stroke-width="1"/>
    <circle r="100" fill="none" stroke="#b6ff3c" stroke-width="1" opacity="0.5"/>

    <text text-anchor="middle" dominant-baseline="middle" font-family="Space Grotesk, Inter, sans-serif"
          font-weight="700" font-size="120" letter-spacing="-2" fill="#f5f5f7">HOA</text>

    <text y="170" text-anchor="middle" font-family="Space Mono, monospace" font-size="11"
          letter-spacing="6" fill="#9a9aa8">HOUSE · OF · ALIENS</text>
  </g>

  <g font-family="Space Mono, monospace" font-size="11" fill="#5c5c6e" letter-spacing="2">
    <text x="60"  y="900">FRAME 001 / 002</text>
    <text x="740" y="900" text-anchor="end">IMAGE PENDING</text>
    <text x="60"  y="935">DROP 004 — ORBIT</text>
    <text x="740" y="935" text-anchor="end">— · — · — · —</text>
  </g>

  <g stroke="#b6ff3c" stroke-width="0.5" opacity="0.3">
    <line x1="400" y1="40" x2="400" y2="960"/>
    <line x1="40"  y1="500" x2="760" y2="500"/>
  </g>
</svg>
