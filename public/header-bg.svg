<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 720" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Cosmic backdrop">
  <defs>
    <radialGradient id="halo" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#b6ff3c" stop-opacity="0.18"/>
      <stop offset="0.4" stop-color="#67e8f9" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#050507" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="720" x2="0" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#050507"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M 64 0 L 0 0 0 64" fill="none" stroke="#22222e" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Void -->
  <rect width="1440" height="720" fill="#050507"/>
  <!-- Halo -->
  <rect width="1440" height="720" fill="url(#halo)"/>
  <!-- Grid floor -->
  <rect y="420" width="1440" height="300" fill="url(#floor)"/>
  <g opacity="0.55">
    <rect y="420" width="1440" height="300" fill="url(#grid)"/>
  </g>

  <!-- Stars -->
  <g fill="#f5f5f7">
    <circle cx="120" cy="80"  r="1.2" opacity="0.9"/>
    <circle cx="320" cy="140" r="0.9" opacity="0.7"/>
    <circle cx="540" cy="60"  r="1.4" opacity="0.85"/>
    <circle cx="780" cy="180" r="1.0" opacity="0.6"/>
    <circle cx="980" cy="100" r="1.3" opacity="0.9"/>
    <circle cx="1180" cy="200" r="0.9" opacity="0.7"/>
    <circle cx="1340" cy="80"  r="1.1" opacity="0.85"/>
    <circle cx="220" cy="240" r="0.8" opacity="0.5"/>
    <circle cx="640" cy="280" r="0.8" opacity="0.5"/>
    <circle cx="1080" cy="300" r="0.9" opacity="0.6"/>
  </g>

  <!-- Distant planet -->
  <g transform="translate(1180,180)" opacity="0.85">
    <circle r="64" fill="#22222e"/>
    <circle r="64" fill="url(#planetShade)"/>
    <ellipse rx="86" ry="14" fill="none" stroke="#67e8f9" stroke-opacity="0.25" stroke-width="2" transform="rotate(-18)"/>
  </g>
  <defs>
    <radialGradient id="planetShade" cx="35%" cy="35%" r="65%">
      <stop offset="0" stop-color="#33334a"/>
      <stop offset="1" stop-color="#0a0a0f"/>
    </radialGradient>
  </defs>
</svg>
